openapi: 3.0.0
info:
  title: Email Service API
  description: SES sender for Talvio Auth hooks and app-triggered welcome mail.
  version: 1.1.0
servers:
  - url: https://api.dev.talvio.co/email
    description: Development
  - url: https://api.talvio.co/email
    description: Production
paths:
  /hooks/send-email:
    post:
      summary: Supabase Auth send_email hook
      operationId: sendEmailHook
      security: []
      parameters:
        - in: header
          name: webhook-id
          required: true
          schema: { type: string }
        - in: header
          name: webhook-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: webhook-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, email_data]
              properties:
                user:
                  type: object
                  properties:
                    email: { type: string, format: email }
                email_data:
                  type: object
                  properties:
                    token: { type: string }
                    token_hash: { type: string }
                    redirect_to: { type: string }
                    email_action_type:
                      type: string
                      enum: [signup, magiclink, recovery, invite, email_change]
                    site_url: { type: string }
                    token_new: { type: string }
                    token_hash_new: { type: string }
                    old_email: { type: string, format: email }
      responses:
        '200':
          description: Empty object. Auth treats any non-2xx as a send failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        '400':
          description: Unknown email_action_type or invalid payload
        '401':
          description: Invalid Standard Webhooks signature
  /private/v1/send:
    post:
      summary: Send a templated email (API key). Used for welcome.
      operationId: sendEmail
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, template, templateData]
              properties:
                to:
                  type: array
                  items: { type: string, format: email }
                template:
                  type: string
                  enum: [magic_link, recovery, invite, email_change, welcome]
                templateData:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: Emails sent successfully
        '400':
          description: Invalid request
        '500':
          description: Internal server error
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-KEY
